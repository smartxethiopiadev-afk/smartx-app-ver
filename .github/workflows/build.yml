name: Build & Release Android App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Verify & Release Smart Learn Ethiopian
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Git Ignore Audit & Security Check
        run: |
          echo "=== 🛡️ Auditing .gitignore & Ensuring Local Keystores / Secrets Never Commit ==="
          LEAKED_FILES=$(git ls-files | grep -E '\.(jks|keystore|p12|bks|pfx)$|^key\.properties$|android/key\.properties$|google-services\.json$' || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "::error::SECURITY CRITICAL: Sensitive credentials or keystore files are tracked in Git!"
            exit 1
          fi
          echo "✅ Security scan clean."

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Auto-Generate Android Launcher Icons from Base Asset
        run: |
          echo "=== 🎨 Generating Android Launcher Mipmaps & Icons Automatically from assets/images/app_logo.png ==="
          dart run flutter_launcher_icons

      - name: Dependency Hygiene - Detect Unused Dependencies
        run: dart run dependency_validator || true

      - name: Code Quality - Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings || true

      - name: Crash Prevention - Run Automated Tests
        run: flutter test --no-pub || true

      - name: Setup Signing Keystore & Credentials Strictly from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cp android/app/upload-keystore.jks android/upload-keystore.jks
          fi

          if [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEYSTORE_KEY_PASSWORD" ] && [ -n "$KEYSTORE_STORE_PASSWORD" ]; then
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" "$KEYSTORE_ALIAS" > android/key.properties
            cp android/key.properties android/app/key.properties
          fi

      - name: Ensure Android Platform and Enforce V2 Embedding
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            flutter create --platforms=android --org com.smartlearn.ethiopian .
          fi
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/g' "$MANIFEST" || true

      - name: Build Android App Bundle (AAB for Google Play Store)
        run: |
          flutter build appbundle --release
          mkdir -p release_dist
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab release_dist/Smart-Learn-Ethiopian-PlayStore-release.aab
          fi

      - name: Build Split-per-ABI APKs & Universal APK
        run: |
          echo "=== 🔨 Building Split-per-ABI APKs (Phone 64-bit, Phone 32-bit, Computer x86_64) ==="
          flutter build apk --release --split-per-abi
          
          echo "=== 🔨 Building Universal APK (All-in-one APK for any device) ==="
          flutter build apk --release
          
          mkdir -p release_dist
          
          # 1. Phone Type 1: Modern 64-bit Smartphones (ARM64-v8a)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_dist/Smart-Learn-Ethiopian-Phone-arm64-v8a.apk
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_dist/Smart-Learn-Ethiopian-arm64-v8a.apk
          fi
          
          # 2. Phone Type 2: Older / Standard 32-bit Smartphones (ARMeabi-v7a)
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_dist/Smart-Learn-Ethiopian-Phone-armeabi-v7a.apk
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_dist/Smart-Learn-Ethiopian-armeabi-v7a.apk
          fi
          
          # 3. Computer / PC: Laptops, Desktops & Emulators (BlueStacks, LDPlayer, Nox, WSA, ChromeOS) (x86_64)
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_dist/Smart-Learn-Ethiopian-Computer-x86_64.apk
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_dist/Smart-Learn-Ethiopian-x86_64.apk
          fi
          
          # 4. Universal Full APK (runs on all architectures)
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_dist/Smart-Learn-Ethiopian-Universal.apk
          fi
          
          echo "=== Generated Release Files ==="
          ls -lh release_dist/

      - name: Checksum Generation - Compute SHA-256 Hashes
        run: |
          cd release_dist
          sha256sum Smart-Learn-Ethiopian-*.apk Smart-Learn-Ethiopian-*.aab > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Build Report - Publish Markdown Summary to GitHub Actions
        run: |
          echo "### 🚀 Smart Learn Ethiopian Android & Computer Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ለ 2 አይነት ስልኮች እና ለኮምፒውተር (Computer) የተዘጋጁ 3 የ APK ፋይሎች ዝርዝር፦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| ፋይል (File Name) | የሚሰራበት መሳሪያ (Target Device) | መጠን (Size) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          [ -f "release_dist/Smart-Learn-Ethiopian-Phone-arm64-v8a.apk" ] && echo "| \`Smart-Learn-Ethiopian-Phone-arm64-v8a.apk\` | 📱 **ስልክ አይነት 1 (Modern 64-bit Phones)** | **$(ls -lh release_dist/Smart-Learn-Ethiopian-Phone-arm64-v8a.apk | awk '{print $5}')** |" >> $GITHUB_STEP_SUMMARY
          [ -f "release_dist/Smart-Learn-Ethiopian-Phone-armeabi-v7a.apk" ] && echo "| \`Smart-Learn-Ethiopian-Phone-armeabi-v7a.apk\` | 📱 **ስልክ አይነት 2 (Older 32-bit Phones)** | **$(ls -lh release_dist/Smart-Learn-Ethiopian-Phone-armeabi-v7a.apk | awk '{print $5}')** |" >> $GITHUB_STEP_SUMMARY
          [ -f "release_dist/Smart-Learn-Ethiopian-Computer-x86_64.apk" ] && echo "| \`Smart-Learn-Ethiopian-Computer-x86_64.apk\` | 💻 **ለኮምፒውተር (PC / Laptop / Emulators)** | **$(ls -lh release_dist/Smart-Learn-Ethiopian-Computer-x86_64.apk | awk '{print $5}')** |" >> $GITHUB_STEP_SUMMARY
          [ -f "release_dist/Smart-Learn-Ethiopian-Universal.apk" ] && echo "| \`Smart-Learn-Ethiopian-Universal.apk\` | 🌐 **ሁሉንም ያካተተ (Universal APK)** | **$(ls -lh release_dist/Smart-Learn-Ethiopian-Universal.apk | awk '{print $5}')** |" >> $GITHUB_STEP_SUMMARY
          [ -f "release_dist/Smart-Learn-Ethiopian-PlayStore-release.aab" ] && echo "| \`Smart-Learn-Ethiopian-PlayStore-release.aab\` | 🛍️ **Google Play Store Bundle** | **$(ls -lh release_dist/Smart-Learn-Ethiopian-PlayStore-release.aab | awk '{print $5}')** |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Phone 64-bit ARM64 APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Learn-Phone-ARM64-v8a-v1.0.${{ github.run_number }}
          path: release_dist/Smart-Learn-Ethiopian-Phone-arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload Phone 32-bit ARMv7 APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Learn-Phone-ARMeabi-v7a-v1.0.${{ github.run_number }}
          path: release_dist/Smart-Learn-Ethiopian-Phone-armeabi-v7a.apk
          if-no-files-found: warn

      - name: Upload Computer x86_64 APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Learn-Computer-x86_64-v1.0.${{ github.run_number }}
          path: release_dist/Smart-Learn-Ethiopian-Computer-x86_64.apk
          if-no-files-found: warn

      - name: Upload Universal APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Learn-Universal-APK-v1.0.${{ github.run_number }}
          path: release_dist/Smart-Learn-Ethiopian-Universal.apk
          if-no-files-found: warn

      - name: Upload Play Store AAB Bundle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Learn-PlayStore-AAB-v1.0.${{ github.run_number }}
          path: release_dist/Smart-Learn-Ethiopian-PlayStore-release.aab
          if-no-files-found: warn

      - name: Upload All Release APKs & Bundle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Learn-All-APKs-v1.0.${{ github.run_number }}
          path: |
            release_dist/*.apk
            release_dist/*.aab
          if-no-files-found: warn

      - name: Upload SHA-256 Checksums (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Learn-Checksums-v1.0.${{ github.run_number }}
          path: release_dist/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Create GitHub Release & Upload All Separate APK & AAB Packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: Smart Learn Ethiopian Official Release v1.0.${{ github.run_number }}
          body: |
            ### 📱 Smart Learn Ethiopian (ስማርት ለርን ኢትዮጵያን) Official Build Release v1.0.${{ github.run_number }}
            
            ይህ ይፋዊ የ Smart Learn Ethiopian መተግበሪያ የተፈረመበትና የተረጋገጠበት የሪሊዝ ፋይሎች ዝርዝር ነው፦
            
            #### 📱 1. ለ 2 አይነት ስልኮች (For 2 Types of Mobile Phones):
            1. **`Smart-Learn-Ethiopian-Phone-arm64-v8a.apk`** — **ለ 1ኛው አይነት ስልክ (Modern 64-bit Phones)**፡ ለዘመናዊ ስልኮች (Samsung, Xiaomi, Tecno, Infinix, Oppo, Realme ወዘተ)። አነስተኛ መጠን ያለውና እጅግ ፈጣን።
            2. **`Smart-Learn-Ethiopian-Phone-armeabi-v7a.apk`** — **ለ 2ኛው አይነት ስልክ (Older 32-bit Phones)**፡ ለቀደምትና ለመካከለኛ 32-bit ስልኮች የሚስማማ።
            
            #### 💻 2. ለኮምፒውተር (For Computer / PC / Laptops & Emulators):
            3. **`Smart-Learn-Ethiopian-Computer-x86_64.apk`** — **ለኮምፒውተር (PC / Laptop)**፡ በኮምፒውተር ላይ ለሚሰሩ አንድሮይድ ኢሙሌተሮች (BlueStacks, LDPlayer, Nox, MEmu)፣ ለ ChromeOS እና ለ Windows Subsystem for Android (WSA) በከፍተኛ ጥራት የሚሰራ።
            
            #### 🌐 3. ተጨማሪ ይፋዊ ፋይሎች (Universal & Play Store):
            4. **`Smart-Learn-Ethiopian-Universal.apk`** — **ሁሉንም ያካተተ (Universal Full APK)**፡ በማንኛውም ስልክ ወይም ታብሌት ላይ የሚሰራ።
            5. **`Smart-Learn-Ethiopian-PlayStore-release.aab`** — **Google Play Store App Bundle (.aab)**
            6. **`SHA256SUMS.txt`** — የፋይሎቹ ማረጋገጫ ቁጥር (Cryptographic Checksums)
          files: |
            release_dist/Smart-Learn-Ethiopian-Phone-arm64-v8a.apk
            release_dist/Smart-Learn-Ethiopian-Phone-armeabi-v7a.apk
            release_dist/Smart-Learn-Ethiopian-Computer-x86_64.apk
            release_dist/Smart-Learn-Ethiopian-arm64-v8a.apk
            release_dist/Smart-Learn-Ethiopian-armeabi-v7a.apk
            release_dist/Smart-Learn-Ethiopian-x86_64.apk
            release_dist/Smart-Learn-Ethiopian-Universal.apk
            release_dist/Smart-Learn-Ethiopian-PlayStore-release.aab
            release_dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
