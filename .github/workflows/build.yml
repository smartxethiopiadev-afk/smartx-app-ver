name: Build and Optimize Flutter Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Production Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # ------------------------------------------------------------------------
      # SECURITY & SECRET RECONSTRUCTION STEP
      # ------------------------------------------------------------------------
      - name: Reconstruct google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Reconstructing android/app/google-services.json from secret..."
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f "android/app/google-services.json" ]; then
            echo "Using existing local google-services.json file."
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not provided and file not found."
          fi

      - name: Decode Production Keystore from Base64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from Base64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore
          else
            echo "NOTICE: KEYSTORE_BASE64 secret not found. Fallback or debug config will be applied."
          fi
 
      - name: Generate Android key.properties dynamically
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_STORE_PASSWORD" ] && [ -n "$KEYSTORE_ALIAS" ]; then
            echo "Generating android/key.properties..."
            echo "storePassword=$KEYSTORE_STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEYSTORE_ALIAS" >> android/key.properties
            echo "storeFile=my-release-key.keystore" >> android/key.properties
          else
            echo "NOTICE: Secrets not set."
          fi
          
      - name: Optimize PNG & JPG Assets
        run: |
          sudo apt-get update && sudo apt-get install -y optipng jpegoptim
          echo "Optimizing PNG assets..."
          find assets/ -type f -name "*.png" -exec optipng -o2 -strip all {} + 2>/dev/null || true
          echo "Optimizing JPG/JPEG assets..."
          find assets/ -type f \( -name "*.jpg" -o -name "*.jpeg" \) -exec jpegoptim --max=82 --strip-all {} + 2>/dev/null || true

      # ------------------------------------------------------------------------
      # CODE ANALYSIS & NON-FATAL VERIFICATION
      # ------------------------------------------------------------------------
      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Optional Dependency Validation
        continue-on-error: true
        run: |
          if flutter pub run dependency_validator --help > /dev/null 2>&1; then
            flutter pub run dependency_validator || true
          else
            echo "dependency_validator not installed or skipped."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # ------------------------------------------------------------------------
      # PRODUCTION APK BUILD
      # ------------------------------------------------------------------------
      - name: Build Production Release APK
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_FILE: 'my-release-key.keystore'
        run: |
          flutter build apk --release \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --build-number=${{ github.run_number }}

      # ------------------------------------------------------------------------
      # ARTIFACT UPLOAD (actions/upload-artifact@v4)
      # ------------------------------------------------------------------------
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-x-release-apk-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.2-build.${{ github.run_number }}" \
            build/app/outputs/flutter-apk/*.apk \
            --title "Release v1.0.2 (Build #${{ github.run_number }})" \
            --notes "Production build #${{ github.run_number }} compiled with secure credential injection, code obfuscation, and Java 17 Zulu runtime."

      - name: Clean Up Sensitive Build Artifacts
        if: always()
        run: |
          echo "Purging temporary keystore and credential files from runner disk..."
          rm -f android/app/my-release-key.keystore
          rm -f android/key.properties
          rm -f android/app/google-services.json
