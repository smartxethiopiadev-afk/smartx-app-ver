name: Build and Optimize Flutter Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Packages
        run: flutter pub get

      - name: Install Image Optimization Tools & Compress Assets
        run: |
          sudo apt-get update && sudo apt-get install -y webp imagemagick optipng jpegoptim
          echo "Optimizing PNG assets..."
          find assets/ -type f -name "*.png" -exec optipng -o2 -strip all {} +
          echo "Optimizing JPG/JPEG assets..."
          find assets/ -type f \( -name "*.jpg" -o -name "*.jpeg" \) -exec jpegoptim --max=82 --strip-all {} +

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Check Unused Packages
        run: |
          flutter pub global activate dependency_validator
          flutter pub global run dependency_validator

      - name: Analyze Code
        run: flutter analyze

      - name: Ensure google-services.json exists
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Successfully restored google-services.json from secret."
          elif [ -f "android/app/google-services.json" ]; then
            echo "Using existing android/app/google-services.json from workspace."
          fi

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Gradle Signing Report
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build Code Artifact (Split APKs with Tree Shaken Icons & Obfuscation)
        run: flutter build apk --release --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=build/app/outputs/symbols --build-number=${{ github.run_number }}

      - name: Create GitHub Release & Upload Release APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.2-build.${{ github.run_number }}" \
            build/app/outputs/flutter-apk/*.apk \
            --title "Release v1.0.2 (Build #${{ github.run_number }})" \
            --notes "Interactive automatic production release of Smart X Academy (Build #${{ github.run_number }}). Built on $(date +'%Y-%m-%d %H:%M:%S UTC'). This package contains 3 optimized, split APKs for different processor architectures (armeabi-v7a, arm64-v8a, and x86_64) with obfuscated code, split debug symbols, tree-shaken icons, and compressed WebP/image assets, ensuring lightweight downloads and high UI resolution."
