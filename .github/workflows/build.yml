name: Build and Optimize Flutter Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Production Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # ------------------------------------------------------------------------
      # CODE ANALYSIS, LINT & UNUSED CODE CHECKS
      # ------------------------------------------------------------------------
      - name: Strict Unused Code & Lint Check (dart analyze)
        run: dart analyze --fatal-infos

      - name: Detect Unreferenced & Unused Assets in assets/
        run: |
          echo "Scanning assets/ directory for unreferenced files..."
          UNREFERENCED_FOUND=0
          if [ -d "assets" ]; then
            for asset in $(find assets -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.webp" -o -name "*.json" \)); do
              filename=$(basename "$asset")
              # Check if the filename or path is referenced across the lib/ source code
              if ! grep -rq "$filename" lib/ 2>/dev/null; then
                echo "::warning file=$asset::Asset file '$asset' appears unreferenced in lib/ codebase."
                UNREFERENCED_FOUND=$((UNREFERENCED_FOUND + 1))
              fi
            done
            echo "Asset scan complete. Unreferenced assets detected: $UNREFERENCED_FOUND"
          else
            echo "No assets directory found to scan."
          fi

      - name: Check Broken URLs and Dead Links (lychee)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --exclude-all-private --exclude-mail --timeout 15 --max-concurrency 8 'lib/**/*.dart' 'README.md'
          fail: false

      - name: Run Flutter Tests
        run: flutter test

      # ------------------------------------------------------------------------
      # SECURITY & SECRET RECONSTRUCTION STEP
      # ------------------------------------------------------------------------
      - name: Reconstruct google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Reconstructing android/app/google-services.json from secret..."
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f "android/app/google-services.json" ]; then
            echo "Using existing local google-services.json file."
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not provided and file not found."
          fi

      - name: Decode Production Keystore from Base64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from Base64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore
          else
            echo "NOTICE: KEYSTORE_BASE64 secret not found. Fallback or debug config will be applied."
          fi

      - name: Generate Android key.properties dynamically
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_STORE_PASSWORD" ] && [ -n "$KEYSTORE_ALIAS" ]; then
            echo "Generating android/key.properties dynamically from secrets..."
            echo "storePassword=$KEYSTORE_STORE_PASSWORD" > android/key.properties
            echo "keyPassword=${KEYSTORE_KEY_PASSWORD:-$KEYSTORE_STORE_PASSWORD}" >> android/key.properties
            echo "keyAlias=$KEYSTORE_ALIAS" >> android/key.properties
            echo "storeFile=my-release-key.keystore" >> android/key.properties
          else
            echo "NOTICE: Keystore password/alias secrets not set; build will use fallback configuration."
          fi

      # ------------------------------------------------------------------------
      # ASSET OPTIMIZATION & LAUNCHER ICONS GENERATION
      # ------------------------------------------------------------------------
      - name: Optimize PNG & JPG Assets
        run: |
          sudo apt-get update && sudo apt-get install -y optipng jpegoptim
          echo "Optimizing PNG assets..."
          find assets/ -type f -name "*.png" -exec optipng -o2 -strip all {} + 2>/dev/null || true
          echo "Optimizing JPG/JPEG assets..."
          find assets/ -type f \( -name "*.jpg" -o -name "*.jpeg" \) -exec jpegoptim --max=82 --strip-all {} + 2>/dev/null || true

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # ------------------------------------------------------------------------
      # PRODUCTION APK BUILD (Split per ABI: arm64-v8a, armeabi-v7a, x86_64)
      # ------------------------------------------------------------------------
      - name: Build Production Split Release APKs
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_FILE: 'my-release-key.keystore'
        run: |
          flutter build apk --release \
            --split-per-abi \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --build-number=${{ github.run_number }}

      # ------------------------------------------------------------------------
      # ARTIFACT UPLOAD (actions/upload-artifact@v4 - Captures all 3 APKs)
      # ------------------------------------------------------------------------
      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-x-release-split-apks-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # ------------------------------------------------------------------------
      # GITHUB RELEASE CREATION
      # ------------------------------------------------------------------------
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.2-build.${{ github.run_number }}" \
            build/app/outputs/flutter-apk/*.apk \
            --title "Release v1.0.2 (Build #${{ github.run_number }})" \
            --notes "Production build #${{ github.run_number }} compiled with ABI split architecture (arm64-v8a, armeabi-v7a, x86_64), secure credential injection, asset optimization, and quality verification."

      # ------------------------------------------------------------------------
      # CLEANUP
      # ------------------------------------------------------------------------
      - name: Clean Up Sensitive Build Artifacts
        if: always()
        run: |
          echo "Purging temporary keystore and credential files from runner disk..."
          rm -f android/app/my-release-key.keystore
          rm -f android/key.properties
          rm -f android/app/google-services.json
