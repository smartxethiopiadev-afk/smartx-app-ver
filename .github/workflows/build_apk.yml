name: Build & Release Android App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Setup Google Services JSON from Secrets
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Writing google-services.json from GOOGLE_SERVICES_JSON..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_BASE64 }}" ]; then
            echo "Decoding google-services.json from GOOGLE_SERVICES_BASE64..."
            echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > android/app/google-services.json
          else
            echo "No google-services.json secret provided; using existing project setup if present."
          fi

      - name: Setup Signing Keystore & Key Properties from Secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from RELEASE_KEYSTORE_BASE64..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          elif [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "Writing keystore from KEYSTORE_FILE..."
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/upload-keystore.jks
          fi

          if [ -n "${{ secrets.KEY_PROPERTIES }}" ]; then
            echo "Writing key.properties from KEY_PROPERTIES..."
            echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
          elif [ -n "${{ secrets.KEY_PROPERTIES_BASE64 }}" ]; then
            echo "Decoding key.properties from KEY_PROPERTIES_BASE64..."
            echo "${{ secrets.KEY_PROPERTIES_BASE64 }}" | base64 --decode > android/key.properties
          fi

      - name: Verify Code Quality & Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android App Bundle (AAB for Google Play Store)
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_STORE_FILE: 'upload-keystore.jks'
        run: flutter build appbundle --release

      - name: Build Release Universal APK
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_STORE_FILE: 'upload-keystore.jks'
        run: flutter build apk --release

      - name: Create GitHub Release & Upload AAB + APK Assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: Smart X Ethiopian Release v1.0.${{ github.run_number }}
          body: |
            Production Build Release for Smart X Ethiopian.
            
            - **App Bundle (.aab)**: Production release for Google Play Store console upload.
            - **Universal APK (.apk)**: Standalone installer for direct testing and installation.
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
