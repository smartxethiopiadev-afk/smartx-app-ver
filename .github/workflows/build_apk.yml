name: Build & Release Android App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Verify & Release Flutter App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ------------------------------------------------------------------------
      # Feature 1: Repository Secret & Credential Leak Security Scanner
      # ------------------------------------------------------------------------
      - name: Security Check - Scan for Accidentally Committed Secrets
        run: |
          echo "=== Scanning repository for leaked signing keys or sensitive credentials ==="
          LEAKED_FILES=$(git ls-files | grep -E '\.(jks|keystore|p12|bks|pfx)$|^key\.properties$|android/key\.properties$' || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "::error::SECURITY CRITICAL: Sensitive credentials or keystore files are committed in Git!"
            echo "Leaked file(s):"
            echo "$LEAKED_FILES"
            exit 1
          fi
          echo "Security scan clean: No sensitive private keys or local properties in Git index."

      - name: Install Flutter Dependencies
        run: flutter pub get

      # ------------------------------------------------------------------------
      # Feature 2: Code Quality, Dead Code, Unused Imports & Syntax Analyzer
      # ------------------------------------------------------------------------
      - name: Code Quality - Analyze Lint, Dead Code & Potential Bugs
        run: |
          echo "=== Running Flutter static analysis for code defects & dead code ==="
          flutter analyze --no-fatal-infos

      # ------------------------------------------------------------------------
      # Feature 3: Automated Unit & Widget Test Runner (Crash Prevention)
      # ------------------------------------------------------------------------
      - name: Crash Prevention - Run Automated Tests
        run: |
          echo "=== Running automated tests to catch runtime logic issues ==="
          flutter test --no-pub

      - name: Setup Google Services JSON from Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Processing google-services.json from GOOGLE_SERVICES_JSON secret..."
            # Check if value is base64 encoded or raw JSON
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '^{' ; then
              printf "%s\n" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json 2>/dev/null || printf "%s\n" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            fi
            
            # Validate JSON format
            if python3 -c "import json, sys; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
              echo "✅ SUCCESS: android/app/google-services.json is valid JSON!"
            else
              echo "WARNING: android/app/google-services.json is invalid JSON! Removing to prevent build failure."
              rm -f android/app/google-services.json
            fi
          else
            echo "ℹ️ GOOGLE_SERVICES_JSON secret not provided; skipping."
          fi

      - name: Setup Signing Keystore & Credentials Strictly from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          echo "================================================================"
          echo "🔐 ENFORCING RELEASE SIGNING KEYSTORE FROM GITHUB SECRETS"
          echo "================================================================"
          mkdir -p android/app

          # 1. Validate and decode KEYSTORE_BASE64
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CRITICAL: 'KEYSTORE_BASE64' secret is missing from GitHub Repository Secrets!"
            echo "Please add your base64-encoded keystore to Repository Settings > Secrets > KEYSTORE_BASE64"
            exit 1
          fi

          echo "Decoding release keystore into android/app/upload-keystore.jks..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cp android/app/upload-keystore.jks android/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::CRITICAL: Decoded keystore file is empty or corrupted base64 string!"
            exit 1
          fi
          echo "✅ Keystore file written successfully: android/app/upload-keystore.jks ($(wc -c < android/app/upload-keystore.jks) bytes)"

          # 2. Validate credentials
          if [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ]; then
            echo "::error::CRITICAL: Missing signing credentials in GitHub Secrets!"
            echo "Required secrets: KEYSTORE_ALIAS, KEYSTORE_KEY_PASSWORD, KEYSTORE_STORE_PASSWORD"
            exit 1
          fi

          # 3. Generate android/key.properties directly from secrets
          echo "Generating android/key.properties and android/app/key.properties directly from secrets..."
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" "$KEYSTORE_ALIAS" > android/key.properties
          cp android/key.properties android/app/key.properties
          echo "✅ key.properties generated successfully."

          # 4. Cryptographic Keystore Verification with keytool
          echo "=== Verifying Keystore Integrity & Certificate Fingerprints ==="
          if ! keytool -list -v -keystore android/app/upload-keystore.jks -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_STORE_PASSWORD" -keypass "$KEYSTORE_KEY_PASSWORD" > /tmp/keystore_cert_info.txt 2>&1; then
            echo "::error::KEYSTORE CREDENTIAL MISMATCH: The provided alias '$KEYSTORE_ALIAS' or passwords do NOT match the keystore!"
            cat /tmp/keystore_cert_info.txt
            exit 1
          fi

          echo "✅ Keystore credentials successfully verified!"
          echo "Certificate Details & Digital Fingerprints:"
          grep -E "Owner:|Issuer:|Valid from:|Certificate fingerprints:|SHA256:|SHA1:" /tmp/keystore_cert_info.txt || true
          echo "================================================================"

      # ------------------------------------------------------------------------
      # Android V2 Embedding Enforcement & Auto-Healing
      # ------------------------------------------------------------------------
      - name: Ensure Android Platform and Enforce V2 Embedding
        run: |
          echo "=== Verifying and Enforcing Android V2 Embedding ==="
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # Self-healing: if Android folder or manifest is missing, reconstruct it
          if [ ! -f "$MANIFEST" ]; then
            echo "WARNING: $MANIFEST not found. Generating complete Android platform structure..."
            flutter create --platforms=android --org com.smartx.learning .
          fi

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::CRITICAL: Unable to locate or generate $MANIFEST!"
            exit 1
          fi

          # Ensure Gradle wrapper script is executable
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          # 1. Replace legacy v1 FlutterApplication with modern ${applicationName}
          sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/g' "$MANIFEST"

          # 2. Ensure flutterEmbedding meta-data with value="2" exists
          if grep -q 'android:name="flutterEmbedding"' "$MANIFEST"; then
            echo "flutterEmbedding tag found; ensuring value is 2..."
            sed -i 's/android:name="flutterEmbedding"[^>]*android:value="[0-9]*"/android:name="flutterEmbedding" android:value="2"/g' "$MANIFEST"
          else
            echo "Injecting flutterEmbedding v2 meta-data tag into $MANIFEST..."
            sed -i '/<\/application>/i \        <!-- Flutter V2 Embedding Required by Flutter 3.x+ -->\n        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />' "$MANIFEST"
          fi

          # 3. Remove deprecated splash screen v1 meta-data if present
          sed -i '/io.flutter.app.android.SplashScreenUntilFirstFrame/d' "$MANIFEST"

          echo "V2 Embedding verification complete. Manifest embedding snippet:"
          grep -C 2 'flutterEmbedding' "$MANIFEST" || true

      - name: Build Android App Bundle (AAB for Google Play Store)
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_STORE_FILE: 'upload-keystore.jks'
        run: |
          flutter build appbundle --release
          mkdir -p release_dist
          cp build/app/outputs/bundle/release/app-release.aab release_dist/SmartX-Ethiopian-PlayStore-release.aab

      - name: Build Split-per-ABI APKs & Universal APK
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_STORE_FILE: 'upload-keystore.jks'
        run: |
          # 1. Build Split APKs for modern 64-bit and 32-bit devices
          flutter build apk --release --split-per-abi
          
          # 2. Build Universal APK (works on all devices / architecture)
          flutter build apk --release
          
          mkdir -p release_dist
          # Copy Universal APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_dist/SmartX-Ethiopian-Universal.apk
          fi
          
          # Copy ARM64-v8a APK (Modern phones: Samsung, Xiaomi, Tecno, etc.)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_dist/SmartX-Ethiopian-arm64-v8a.apk
          fi
          
          # Copy armeabi-v7a APK (Older 32-bit phones)
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_dist/SmartX-Ethiopian-armeabi-v7a.apk
          fi
          
          # Copy x86_64 APK (Emulators / ChromeOS)
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_dist/SmartX-Ethiopian-x86_64.apk
          fi

          echo "=== Generated Release Files ==="
          ls -lh release_dist/

      # ------------------------------------------------------------------------
      # MANDATORY REQUIREMENT: Verify Digital Signature on 3 APKs and AAB Bundle
      # If un-signed, fail the build immediately!
      # ------------------------------------------------------------------------
      - name: Strict Verification - Validate Digital Signatures (APK & AAB)
        run: |
          echo "================================================================"
          echo "🔍 DIGITAL SIGNATURE INTEGRITY & VERIFICATION GATEWAY"
          echo "================================================================"

          # 1. Find apksigner executable from Android SDK build-tools
          APKSIGNER_BIN=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_BIN" ]; then
            APKSIGNER_BIN="apksigner"
          fi
          echo "Using APK Signer binary: $APKSIGNER_BIN"

          FAILED=0

          # Verify each APK file
          REQUIRED_APKS=(
            "release_dist/SmartX-Ethiopian-Universal.apk"
            "release_dist/SmartX-Ethiopian-arm64-v8a.apk"
            "release_dist/SmartX-Ethiopian-armeabi-v7a.apk"
          )

          for apk in "${REQUIRED_APKS[@]}"; do
            echo "--------------------------------------------------------"
            echo "Checking Signature for: $apk"
            if [ ! -f "$apk" ]; then
              echo "::error::CRITICAL FAILURE: Expected APK file not found: $apk"
              FAILED=1
              continue
            fi

            # Run apksigner verify with verbose certificate output
            VERIFY_OUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "$apk" 2>&1)
            VERIFY_STATUS=$?

            if [ $VERIFY_STATUS -ne 0 ]; then
              echo "::error::SIGNATURE FAILURE: $apk is NOT signed or signature is corrupted!"
              echo "$VERIFY_OUT"
              FAILED=1
            else
              echo "✅ SUCCESS: $apk signature verified!"
              echo "$VERIFY_OUT" | grep -E "Verified using|Signer #|CN=" || true
            fi
          done

          # 2. Verify Google Play App Bundle (AAB) signature via jarsigner
          AAB_FILE="release_dist/SmartX-Ethiopian-PlayStore-release.aab"
          echo "--------------------------------------------------------"
          echo "Checking Signature for Play Store Bundle: $AAB_FILE"
          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::CRITICAL FAILURE: Play Store AAB file not found: $AAB_FILE"
            FAILED=1
          else
            AAB_VERIFY_OUT=$(jarsigner -verify -verbose -certs "$AAB_FILE" 2>&1)
            if echo "$AAB_VERIFY_OUT" | grep -q "jar verified"; then
              echo "✅ SUCCESS: Play Store AAB signature verified successfully!"
            else
              echo "::error::SIGNATURE FAILURE: $AAB_FILE is NOT signed or invalid!"
              echo "$AAB_VERIFY_OUT" | tail -n 20
              FAILED=1
            fi
          fi

          echo "================================================================"
          if [ $FAILED -ne 0 ]; then
            echo "::error::BUILD ABORTED: One or more release artifacts failed signature validation!"
            exit 1
          fi
          echo "🎉 ALL 3 APKS AND AAB BUNDLE ARE GENUINELY SIGNED AND VALIDATED!"

      # ------------------------------------------------------------------------
      # Feature 4: Cryptographic Checksum Generation (SHA-256)
      # ------------------------------------------------------------------------
      - name: Checksum Generation - Compute SHA-256 Hashes
        run: |
          echo "=== Generating SHA-256 Checksums for Release Assets ==="
          cd release_dist
          sha256sum SmartX-Ethiopian-*.apk SmartX-Ethiopian-*.aab > SHA256SUMS.txt
          echo "Checksums generated in release_dist/SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      # ------------------------------------------------------------------------
      # Feature 5: Artifact Size & Optimization Reporter + GitHub Step Summary
      # ------------------------------------------------------------------------
      - name: Build Report - Publish Markdown Summary to GitHub Actions
        run: |
          echo "### 🚀 Smart X Ethiopian Android Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | Target Architecture | File Size | Signature Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY

          for f in release_dist/SmartX-Ethiopian-*.apk release_dist/SmartX-Ethiopian-*.aab; do
            if [ -f "$f" ]; then
              FNAME=$(basename "$f")
              FSIZE=$(ls -lh "$f" | awk '{print $5}')
              case "$FNAME" in
                *Universal*) ARCH="All Devices (Universal 32/64-bit)" ;;
                *arm64-v8a*) ARCH="ARM 64-bit (Modern Phones)" ;;
                *armeabi-v7a*) ARCH="ARM 32-bit (Older Phones)" ;;
                *x86_64*) ARCH="x86_64 (Emulators / ChromeOS)" ;;
                *PlayStore*) ARCH="Google Play Store Bundle (AAB)" ;;
                *) ARCH="Android" ;;
              esac
              echo "| \`$FNAME\` | $ARCH | **$FSIZE** | ✅ Signed & Verified |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔐 Cryptographic Checksums (SHA-256)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat release_dist/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ *Build processed with strict signature verification, dead code inspection, and zero leaks.*" >> $GITHUB_STEP_SUMMARY

      # Separate Artifact Uploads for each file
      - name: Upload Play Store AAB Bundle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-PlayStore-AAB-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-PlayStore-release.aab
          if-no-files-found: warn

      - name: Upload Universal APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-Universal-APK-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-Universal.apk
          if-no-files-found: warn

      - name: Upload ARM64 64-bit APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-ARM64-v8a-APK-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload ARMv7 32-bit APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-ARMv7a-32bit-APK-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-armeabi-v7a.apk
          if-no-files-found: warn

      - name: Upload SHA-256 Checksums (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-Checksums-v1.0.${{ github.run_number }}
          path: release_dist/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Create GitHub Release & Upload All Separate APK & AAB Packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: Smart X Ethiopian Official Release v1.0.${{ github.run_number }}
          body: |
            ### 📱 Smart X Ethiopian (Grade 9-12) Official Build Release v1.0.${{ github.run_number }}
            
            ይህ ይፋዊ የ Smart X Ethiopian መተግበሪያ የተፈረመበትና የተረጋገጠበት የሪሊዝ ፋይሎች ዝርዝር ነው፦
            
            ---
            
            ### 📦 **የተዘጋጁ ፋይሎች (Download Files):**
            
            1. **`SmartX-Ethiopian-PlayStore-release.aab`**
               * **አይነት:** Google Play Store App Bundle (.aab)
               * **ምስክር ወረቀት:** የተፈረመ (Signed via Release Keystore)
               * **ጥቅም:** በቀጥታ ወደ Google Play Console ለማስገባት (Publish ለማድረግ)።
            
            2. **`SmartX-Ethiopian-Universal.apk`**
               * **አይነት:** Universal Full APK
               * **ምስክር ወረቀት:** የተፈረመ (Signed & Verified)
               * **ጥቅም:** በሁሉም አንድሮይድ ስልኮች፣ ታብሌቶችና ኢሙሌተሮች ላይ ያለምንም ልዩነት በቀጥታ የሚሰራ።
            
            3. **`SmartX-Ethiopian-arm64-v8a.apk`**
               * **አይነት:** 64-bit Optimized APK (ፈጣን እና መጠኑ አነስተኛ)
               * **ምስክር ወረቀት:** የተፈረመ (Signed & Verified)
               * **ጥቅም:** ለአብዛኞቹ ዘመናዊ ስልኮች (Samsung Galaxy, Xiaomi/Redmi, Tecno, Infinix, Oppo, ወዘተ)።
            
            4. **`SmartX-Ethiopian-armeabi-v7a.apk`**
               * **አይነት:** 32-bit Legacy APK
               * **ምስክር ወረቀት:** የተፈረመ (Signed & Verified)
               * **ጥቅም:** ለቀደሙ ወይም ዝቅተኛ አንድሮይድ ስሪት ላላቸው 32-bit ስልኮች።
            
            5. **`SHA256SUMS.txt`**
               * **አይነት:** Cryptographic Checksums
               * **ጥቅም:** የወረዱት ፋይሎች ትክክለኛ መሆናቸውን እና እንዳልተበላሹ ለማረጋገጥ።
          files: |
            release_dist/SmartX-Ethiopian-PlayStore-release.aab
            release_dist/SmartX-Ethiopian-Universal.apk
            release_dist/SmartX-Ethiopian-arm64-v8a.apk
            release_dist/SmartX-Ethiopian-armeabi-v7a.apk
            release_dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
