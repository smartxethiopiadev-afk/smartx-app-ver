name: Build & Release Android App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Flutter App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Setup Google Services JSON from Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "Decoding google-services.json from GOOGLE_SERVICES_BASE64..."
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Writing google-services.json from GOOGLE_SERVICES_JSON..."
            printf "%s\n" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "No google-services.json secret provided; checking existing files..."
          fi

          # Validate JSON syntax to prevent processReleaseGoogleServices MalformedJsonException
          if [ -f android/app/google-services.json ]; then
            if ! python3 -c "import json, sys; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
              echo "WARNING: android/app/google-services.json is invalid or malformed JSON! Removing file to prevent build failure."
              rm -f android/app/google-services.json
            else
              echo "SUCCESS: android/app/google-services.json is valid JSON!"
            fi
          fi

      - name: Setup Signing Keystore & Key Properties from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
        run: |
          mkdir -p android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          elif [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from RELEASE_KEYSTORE_BASE64..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          elif [ -n "$KEYSTORE_FILE" ]; then
            echo "Writing keystore from KEYSTORE_FILE..."
            echo "$KEYSTORE_FILE" | base64 --decode > android/upload-keystore.jks
          fi

          if [ -n "$KEY_PROPERTIES" ]; then
            echo "Writing key.properties from KEY_PROPERTIES..."
            printf "%s\n" "$KEY_PROPERTIES" > android/key.properties
          elif [ -n "$KEY_PROPERTIES_BASE64" ]; then
            echo "Decoding key.properties from KEY_PROPERTIES_BASE64..."
            echo "$KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
          fi

      - name: Verify Code Quality & Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android App Bundle (AAB for Google Play Store)
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_STORE_FILE: 'upload-keystore.jks'
        run: |
          flutter build appbundle --release
          mkdir -p release_dist
          cp build/app/outputs/bundle/release/app-release.aab release_dist/SmartX-Ethiopian-PlayStore-release.aab

      - name: Build Split-per-ABI APKs (arm64-v8a, armeabi-v7a) & Universal APK
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_STORE_FILE: 'upload-keystore.jks'
        run: |
          # 1. Build Split APKs for modern 64-bit and 32-bit devices
          flutter build apk --release --split-per-abi
          
          # 2. Build Universal APK (works on all devices / architecture)
          flutter build apk --release
          
          mkdir -p release_dist
          # Copy Universal APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_dist/SmartX-Ethiopian-Universal.apk
          fi
          
          # Copy ARM64-v8a APK (Modern phones: Samsung, Xiaomi, Tecno, etc.)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_dist/SmartX-Ethiopian-arm64-v8a.apk
          fi
          
          # Copy armeabi-v7a APK (Older 32-bit phones)
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_dist/SmartX-Ethiopian-armeabi-v7a.apk
          fi
          
          # Copy x86_64 APK (Emulators / ChromeOS)
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_dist/SmartX-Ethiopian-x86_64.apk
          fi

          echo "=== Generated Release Files ==="
          ls -lh release_dist/

      # Separate Artifact Uploads for each file
      - name: Upload Play Store AAB Bundle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-PlayStore-AAB-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-PlayStore-release.aab
          if-no-files-found: warn

      - name: Upload Universal APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-Universal-APK-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-Universal.apk
          if-no-files-found: warn

      - name: Upload ARM64 64-bit APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-ARM64-v8a-APK-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload ARMv7 32-bit APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-ARMv7a-32bit-APK-v1.0.${{ github.run_number }}
          path: release_dist/SmartX-Ethiopian-armeabi-v7a.apk
          if-no-files-found: warn

      - name: Create GitHub Release & Upload All Separate APK & AAB Packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: Smart X Ethiopian Official Release v1.0.${{ github.run_number }}
          body: |
            ### 📱 Smart X Ethiopian (Grade 9-12) Official Build Release v1.0.${{ github.run_number }}
            
            ይህ ይፋዊ የ Smart X Ethiopian መተግበሪያ የሪሊዝ ፋይሎች ዝርዝር ነው፦
            
            ---
            
            ### 📦 **የተዘጋጁ ፋይሎች (Download Files):**
            
            1. **`SmartX-Ethiopian-PlayStore-release.aab`**
               * **አይነት:** Google Play Store App Bundle (.aab)
               * **ጥቅም:** በቀጥታ ወደ Google Play Console ለማስገባት (Publish ለማድረግ)።
            
            2. **`SmartX-Ethiopian-Universal.apk`**
               * **አይነት:** Universal Full APK
               * **ጥቅም:** በሁሉም አንድሮይድ ስልኮች፣ ታብሌቶችና ኢሙሌተሮች ላይ ያለምንም ልዩነት በቀጥታ የሚሰራ።
            
            3. **`SmartX-Ethiopian-arm64-v8a.apk`**
               * **አይነት:** 64-bit Optimized APK (ፈጣን እና መጠኑ አነስተኛ)
               * **ጥቅም:** ለአብዛኞቹ ዘመናዊ ስልኮች (Samsung Galaxy, Xiaomi/Redmi, Tecno, Infinix, Oppo, ወዘተ)።
            
            4. **`SmartX-Ethiopian-armeabi-v7a.apk`**
               * **አይነት:** 32-bit Legacy APK
               * **ጥቅም:** ለቀደሙ ወይም ዝቅተኛ አንድሮይድ ስሪት ላላቸው 32-bit ስልኮች።
          files: |
            release_dist/SmartX-Ethiopian-PlayStore-release.aab
            release_dist/SmartX-Ethiopian-Universal.apk
            release_dist/SmartX-Ethiopian-arm64-v8a.apk
            release_dist/SmartX-Ethiopian-armeabi-v7a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
