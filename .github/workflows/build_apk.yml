name: Build Release APK & App Bundle (AAB)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Code Generation
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            echo "Running build_runner build..."
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner specified in pubspec.yaml, skipping."
          fi

      - name: Verify Code Quality & Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Release APKs (Universal & Split-ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB for Play Store)
        run: flutter build appbundle --release

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Split-ABI Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-split-abi-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14
