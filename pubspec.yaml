name: smart_x_academy
description: "A gorgeous, responsive mobile application for Smart X Ethiopian. Replicates the Grade-level courses hub, multilingual support, light/dark modes, and video tutorials."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Visual assets & Fonts
  google_fonts: ^6.2.0

  # Local storage & Connectivity
  shared_preferences: ^2.2.3
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.2
  http: ^1.2.1

  # Backend & Analytics Integration
  supabase_flutter: ^2.6.0
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0

  # Ads, Sharing & Utilities
  google_mobile_ads: ^7.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_html: ^3.0.0-beta.2
  flutter_html_table: ^3.0.0-beta.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  dependency_validator: ^3.2.3

dependency_overrides:
  csslib: 0.17.2

dependency_validator:
  ignore:
    - connectivity_plus

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0F172A"
  image: "assets/images/app_icon.png"
  fullscreen: true
  android_12:
    color: "#0F172A"
    image: "assets/images/app_icon.png"
    icon_background_color: "#0F172A"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
