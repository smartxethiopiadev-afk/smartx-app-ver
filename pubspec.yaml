name: smart_learn_ethiopian
description: "Smart Learn Ethiopian - Comprehensive Ethiopian Curriculum Learning & Exam Preparation Platform for Grades 9-12 with curriculum notes, quizzes, worksheets, offline study, and progress tracking."
publish_to: 'none'

version: 1.0.16+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Visual assets & Fonts
  google_fonts: ^6.2.0

  # Local storage & Connectivity
  shared_preferences: ^2.2.3
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0

  # Firebase Core, Analytics & Crashlytics
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # Backend Integration
  supabase_flutter: ^2.6.0

  # Sharing & Utilities
  url_launcher: ^6.3.0
  flutter_widget_from_html: ^0.15.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  dependency_validator: ^3.2.3
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  web:
    generate: false
    background_color: "#080E1E"
    theme_color: "#0284C7"

flutter_native_splash:
  color: "#080E1E"
  fullscreen: true
  android_12:
    color: "#080E1E"
    icon_background_color: "#080E1E"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
