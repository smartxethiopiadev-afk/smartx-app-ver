name: smart_x_academy
description: "A gorgeous, responsive mobile application for Smart X Ethiopian. Replicates the Grade-level courses hub, multilingual support, light/dark modes, and video tutorials."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Visual assets & Fonts
  google_fonts: ^6.2.0

  # Local storage & Connectivity
  shared_preferences: ^2.2.3
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.2
  http: ^1.2.1

  # Backend & Analytics Integration
  supabase_flutter: ^2.6.0
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0

  # Ads, Sharing & Utilities
  google_mobile_ads: ^7.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_widget_from_html: ^0.15.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  dependency_validator: ^3.2.3
  flutter_lints: ^3.0.0

dependency_validator:
  ignore:
    - connectivity_plus

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  adaptive_icon_background: "#080E1E"
  adaptive_icon_foreground: "android/app/src/main/res/drawable/ic_launcher_foreground.xml"
  web:
    generate: false
    background_color: "#080E1E"
    theme_color: "#0284C7"

flutter_native_splash:
  color: "#080E1E"
  fullscreen: true
  android_12:
    color: "#080E1E"
    icon_background_color: "#080E1E"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
