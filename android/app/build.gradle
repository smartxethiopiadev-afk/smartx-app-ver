plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// ------------------------------------------------------------------------------
// Secure Keystore & Signing Configuration Resolution
// Reads credentials directly from key.properties or System Environment Variables
// ------------------------------------------------------------------------------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('key.properties')
}
if (keystorePropertiesFile.exists()) {
    println "INFO: Found key.properties configuration at: ${keystorePropertiesFile.path}"
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '16'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.16'

android {
    namespace "com.smartx.learning"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            def resolvedKeyAlias = keystoreProperties.getProperty('keyAlias') 
                ?: System.getenv('KEYSTORE_ALIAS') 
                ?: System.getenv('KEY_ALIAS')

            def resolvedKeyPassword = keystoreProperties.getProperty('keyPassword') 
                ?: System.getenv('KEYSTORE_KEY_PASSWORD') 
                ?: System.getenv('KEY_PASSWORD')

            def resolvedStorePassword = keystoreProperties.getProperty('storePassword') 
                ?: System.getenv('KEYSTORE_STORE_PASSWORD') 
                ?: System.getenv('STORE_PASSWORD')

            def rawStoreFile = keystoreProperties.getProperty('storeFile') 
                ?: System.getenv('KEYSTORE_STORE_FILE') 
                ?: 'upload-keystore.jks'

            if (resolvedKeyAlias && resolvedKeyPassword && resolvedStorePassword) {
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
                storePassword resolvedStorePassword

                def keyFile = file(rawStoreFile)
                if (!keyFile.exists()) {
                    keyFile = rootProject.file(rawStoreFile)
                }
                storeFile keyFile
                println "INFO: Release signing configured with keystore: ${keyFile.path} (Alias: ${resolvedKeyAlias})"
            }
        }
    }

    defaultConfig {
        applicationId "com.smartx.learning"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Strictly enforce release signing config
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

// Dynamically apply Google Services plugin if a valid google-services.json is present
def isJsonValid(File jsonFile) {
    if (!jsonFile.exists() || jsonFile.length() < 30) return false
    try {
        new groovy.json.JsonSlurper().parse(jsonFile)
        return true
    } catch (Exception e) {
        println "WARNING: ${jsonFile.name} found at ${jsonFile.path} but contains invalid JSON (${e.message}). Skipping plugin."
        return false
    }
}

def validGsFile = [file("google-services.json"), rootProject.file("google-services.json"), file("src/google-services.json"), file("src/main/google-services.json")].find { isJsonValid(it) }

if (validGsFile) {
    println "INFO: Valid google-services.json detected at ${validGsFile.path}. Applying com.google.gms.google-services plugin."
    apply plugin: 'com.google.gms.google-services'
}
