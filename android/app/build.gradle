plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// ------------------------------------------------------------------------------
// Secure Keystore & Signing Configuration Resolution
// Priority:
// 1. Local key.properties file (for local developer workstation builds)
// 2. System Environment Variables (for GitHub Actions CI/CD pipeline builds)
// ------------------------------------------------------------------------------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('key.properties')
}
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.smartx.learning"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            def resolvedKeyAlias = keystoreProperties.getProperty('keyAlias') 
                ?: System.getenv('KEYSTORE_KEY_ALIAS') 
                ?: System.getenv('KEY_ALIAS')

            def resolvedKeyPassword = keystoreProperties.getProperty('keyPassword') 
                ?: System.getenv('KEYSTORE_KEY_PASSWORD') 
                ?: System.getenv('KEY_PASSWORD')

            def resolvedStorePassword = keystoreProperties.getProperty('storePassword') 
                ?: System.getenv('KEYSTORE_STORE_PASSWORD') 
                ?: System.getenv('STORE_PASSWORD')

            def resolvedStoreFile = keystoreProperties.getProperty('storeFile') 
                ?: System.getenv('KEYSTORE_STORE_FILE') 
                ?: System.getenv('STORE_FILE') 
                ?: 'my-release-key.keystore'

            if (resolvedKeyAlias && resolvedKeyPassword && resolvedStorePassword) {
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
                storePassword resolvedStorePassword

                def keyFile = file(resolvedStoreFile)
                if (!keyFile.exists() && rootProject.file(resolvedStoreFile).exists()) {
                    keyFile = rootProject.file(resolvedStoreFile)
                }
                storeFile keyFile
            }
        }
    }

    defaultConfig {
        applicationId "com.smartx.learning"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Apply release signing config if configured; otherwise fallback to debug config
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                println "WARNING: Release keystore file not found. Falling back to debug signing configuration."
                signingConfig signingConfigs.debug
            }

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

// Dynamically apply Google Services plugin if google-services.json is present
if (file("google-services.json").exists() || rootProject.file("google-services.json").exists() || file("src/google-services.json").exists() || file("src/main/google-services.json").exists()) {
    println "INFO: google-services.json detected. Applying com.google.gms.google-services plugin."
    apply plugin: 'com.google.gms.google-services'
}
